name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  RACK_SDK_VERSION: 2.6.4

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Model tests
        run: make test

  # Hardy only needs the Apple silicon (arm64) Mac build.
  build-mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-arm64
            sdk: "mac-x64%2Barm64 mac-arm64 mac-x64+arm64"
            cc: clang
            cxx: clang++
    name: build-${{ matrix.name }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get Rack SDK
        run: |
          for name in ${{ matrix.sdk }}; do
            url="https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-${name}.zip"
            if curl -sSfL "$url" -o sdk.zip; then echo "Got $url"; break; fi
            echo "Not found: $url"
          done
          unzip -q sdk.zip -d "$RUNNER_TEMP"
      - name: Build
        run: |
          export RACK_DIR="$RUNNER_TEMP/Rack-SDK"
          make -j3 dist CC="${{ matrix.cc }}" CXX="${{ matrix.cxx }}"
      - name: Check for unresolved plugin symbols
        run: |
          # Anything of ours left undefined would make Rack refuse to load the plugin.
          if nm -u plugin.dylib | c++filt | grep -E "tudor::"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Tudor-${{ matrix.name }}
          path: dist/*.vcvplugin

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.vcvplugin
